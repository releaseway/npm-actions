name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string
      acceptance-runs:
        description: Successful exact-candidate fixture run IDs, comma-separated
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        uses: releaseway/actions/prepare@7427110b565bedef79ab0f80e6821a706d7f21ed # v0.5.1
        with:
          mode: resolve
          tag: ${{ inputs.tag }}

      - name: Checkout verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0

      - name: Verify required release files
        env:
          TARGET: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          for path in \
            action.yml \
            dist/main.js \
            dist/native-runtime.cjs \
            .github/workflows/check.yml \
            .github/workflows/release.yml; do
            git cat-file -e "$TARGET:$path"
          done

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:versions
      - run: pnpm run typecheck
      - run: pnpm run verify:dist
      - run: pnpm test
      - run: pnpm run verify:toolchain
      - run: pnpm run verify:pack
      - run: pnpm run verify:yarn-corepack
      - run: pnpm run verify:native-runtime
      - run: pnpm run verify:native-install

      - name: Verify installed native runtime on Node 22, 24 and 26 Alpine
        shell: bash
        run: |
          set -euo pipefail
          for node_version in 22 24 26; do
            docker run --rm \
              --volume "$PWD:/src:ro" \
              "node:${node_version}-alpine" \
              sh -lc 'mkdir /work && cp -a /src/. /work/ && cd /work && wget -qO /tmp/install-pnpm.sh https://get.pnpm.io/install.sh && env PNPM_VERSION=12.14.0 PNPM_HOME=/pnpm SHELL=/bin/sh ENV=/root/.shrc sh /tmp/install-pnpm.sh && export PATH="/pnpm/bin:$PATH" && pnpm install --frozen-lockfile && pnpm run verify:native-runtime && pnpm run verify:native-install'
          done

      - name: Verify tagged source remained clean
        run: git diff --exit-code

      - name: Verify exact-candidate CI and acceptance evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASEWAY_EVIDENCE_TOKEN || github.token }}
          CANDIDATE: ${{ steps.release.outputs.target }}
          ACCEPTANCE_RUNS: ${{ inputs.acceptance-runs }}
        run: |
          python3 scripts/verify-release-evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate "$CANDIDATE" \
            --acceptance-runs "$ACCEPTANCE_RUNS"

      - name: Publish immutable action release
        id: publish
        uses: releaseway/actions@7427110b565bedef79ab0f80e6821a706d7f21ed # v0.5.1
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          latest: "true"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### npm-actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
