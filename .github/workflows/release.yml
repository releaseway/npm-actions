name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable SemVer vX.Y.Z: $TAG" >&2
            exit 1
          fi

          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          TARGET="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$TARGET" origin/main
          git checkout --detach "$TARGET"

          for path in \
            action.yml \
            dist/main.js \
            dist/native-runtime.cjs \
            .github/workflows/check.yml \
            .github/workflows/release.yml; do
            git cat-file -e "$TAG:$path"
          done

          {
            echo "tag=$TAG"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify GitHub Action pins are current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_actions_up=$(npm view actions-up version)
          test "$latest_actions_up" = "1.21.0" || {
            echo "actions-up 1.21.0 is stale; latest is $latest_actions_up" >&2
            exit 1
          }

          npm exec --yes actions-up@1.21.0 -- \
            --dir .github \
            --recursive \
            --dry-run \
            --json \
            --mode major \
            --style sha \
            --prefer-tags \
            --min-age 0 \
            >"$RUNNER_TEMP/actions-up.raw"

          sed -n '/^{/,$p' "$RUNNER_TEMP/actions-up.raw" >"$RUNNER_TEMP/actions-up.json"
          jq -e '.summary.totalUpdates == 0 and .summary.totalRunnerUpdates == 0 and .summary.totalBlockedByMode == 0 and .summary.totalBlockedByAge == 0' \
            "$RUNNER_TEMP/actions-up.json" >/dev/null

      - run: npm ci
      - run: npm run verify:versions
      - run: npm run typecheck
      - run: npm run verify:dist
      - run: npm test
      - run: npm run verify:toolchain
      - run: npm run verify:pack
      - run: npm run verify:yarn-corepack
      - run: npm run verify:native-runtime
      - run: npm run verify:native-install

      - name: Verify native runtime on current Node 24 Alpine
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            node:24-alpine \
            sh -lc 'mkdir /work && cp -a /src/. /work/ && cd /work && npm ci && npm run verify:native-runtime'

      - name: Verify tagged source remained clean
        run: git diff --exit-code

      - name: Publish immutable action release
        id: publish
        uses: releaseway/actions@49c543357d96884d0e5a683c45d45ebd50a8b612 # v0.1.4
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          latest: "true"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### npm-actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
