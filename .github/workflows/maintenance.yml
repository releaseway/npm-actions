name: Dependency maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Report GitHub Action updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_actions_up=$(pnpm view actions-up version)
          test "$latest_actions_up" = "1.21.0" || {
            echo "::warning::actions-up 1.21.0 is stale; latest is $latest_actions_up"
          }

          pnpm dlx actions-up@1.21.0 \
            --dir .github \
            --recursive \
            --dry-run \
            --json \
            --mode major \
            --style sha \
            --prefer-tags \
            --min-age 0 \
            >"$RUNNER_TEMP/actions-up.raw"

          sed -n '/^{/,$p' "$RUNNER_TEMP/actions-up.raw" >"$RUNNER_TEMP/actions-up.json"
          jq '{summary, updates: [.updates[] | select(.hasUpdate) | {action: .action.name, file: .action.file, current: .currentVersion, target: .latestVersion}]}' \
            "$RUNNER_TEMP/actions-up.json"
          current=$(jq '.summary.totalUpdates == 0 and .summary.totalRunnerUpdates == 0 and .summary.totalBlockedByMode == 0 and .summary.totalBlockedByAge == 0' \
            "$RUNNER_TEMP/actions-up.json")
          if [ "$current" != true ]; then
            echo "::warning::GitHub Action updates are available; see the update report above."
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:latest
