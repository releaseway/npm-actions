name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:versions
      - run: pnpm run typecheck
      - run: python3 test/release-evidence.py
      - run: python3 test/evidence-bundle.py
      - run: python3 test/homebrew-feature-evidence.py
      - run: pnpm run verify:dist
      - run: pnpm run build
      - run: git diff --exit-code -- dist

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  pack-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:toolchain
      - run: pnpm run verify:pack
      - run: pnpm run verify:yarn-corepack

  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:native-runtime
      - run: pnpm run verify:native-install

  musl-runtime:
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify installed native runtime on Node ${{ matrix.node }} Alpine
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            node:${{ matrix.node }}-alpine \
            sh -lc 'mkdir /work && cp -a /src/. /work/ && cd /work && wget -qO /tmp/install-pnpm.sh https://get.pnpm.io/install.sh && env PNPM_VERSION=12.14.0 PNPM_HOME=/pnpm SHELL=/bin/sh ENV=/root/.shrc sh /tmp/install-pnpm.sh && export PATH="/pnpm/bin:$PATH" && pnpm install --frozen-lockfile && pnpm run verify:native-runtime && pnpm run verify:native-install'

  fake-registry-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify reconciliation, publisher, and orchestration without live mutation
        run: >-
          node --test
          test/registry.test.mjs
          test/publish.test.mjs
          test/orchestrate.test.mjs
