name: Check

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ vars.RELEASEWAY_FORCE_FULL }}
        run: python3 scripts/ci-mode.py

  docs:
    needs: inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - run: python3 scripts/check-docs.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test test/docs.test.mjs

  coverage:
    name: coverage (${{ github.event_name == 'pull_request' && 'smoke' || 'full' }})
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.matrix.outputs.runtime }}
      musl: ${{ steps.matrix.outputs.musl }}
      coverage: ${{ steps.matrix.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        run: python3 scripts/ci-matrix.py

  static:
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 test/release-inputs.py
      - run: python3 test/release-reuse.py
      - run: python3 test/ci-contract.py
      - run: python3 test/release-preparation.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:versions
      - run: pnpm run typecheck
      - run: python3 test/release-evidence.py
      - run: python3 test/evidence-bundle.py
      - run: python3 test/release-set-evidence.py
      - run: python3 test/homebrew-feature-evidence.py
      - run: pnpm run verify:dist

  unit:
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  pack-integration:
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:toolchain
      - run: pnpm run verify:pack
      - run: pnpm run verify:yarn-corepack

  artifact-contract:
    name: artifacts (${{ matrix.runner }})
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test test/artifacts.test.mjs test/artifact-report.test.mjs test/orchestrate.test.mjs
      - run: pnpm run verify:prepacked
      - run: pnpm run verify:pack

  runtime-matrix:
    name: native (${{ matrix.runner }}, ${{ matrix.node }})
    needs: [inputs, coverage]
    if: needs.inputs.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.coverage.outputs.runtime) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:native-runtime
      - run: pnpm run verify:native-install

  musl-runtime:
    name: musl (${{ matrix.node }})
    needs: [inputs, coverage]
    if: needs.inputs.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.coverage.outputs.musl) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify installed native runtime on Node ${{ matrix.node }} Alpine
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            node:${{ matrix.node }}-alpine \
            sh -lc 'mkdir /work && cp -a /src/. /work/ && cd /work && wget -qO /tmp/install-pnpm.sh https://get.pnpm.io/install.sh && env PNPM_VERSION=12.14.0 PNPM_HOME=/pnpm SHELL=/bin/sh ENV=/root/.shrc sh /tmp/install-pnpm.sh && export PATH="/pnpm/bin:$PATH" && pnpm install --frozen-lockfile && pnpm run verify:native-runtime && pnpm run verify:native-install'

  validation:
    name: validation
    if: always()
    needs: [inputs, docs, coverage, static, unit, pack-integration, artifact-contract, runtime-matrix, musl-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CI_MODE: ${{ needs.inputs.outputs.mode }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py
