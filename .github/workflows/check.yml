name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run verify:versions
      - run: npm run typecheck
      - run: python3 test/release-evidence.py
      - run: npm run verify:dist
      - run: npm run build
      - run: git diff --exit-code -- dist

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm test

  pack-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run verify:toolchain
      - run: npm run verify:pack
      - run: npm run verify:yarn-corepack

  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run verify:native-runtime
      - run: npm run verify:native-install

  musl-runtime:
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify installed native runtime on Node ${{ matrix.node }} Alpine
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            node:${{ matrix.node }}-alpine \
            sh -lc 'mkdir /work && cp -a /src/. /work/ && cd /work && npm ci && npm run verify:native-runtime && npm run verify:native-install'

  fake-registry-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Verify reconciliation, publisher, and orchestration without live mutation
        run: >-
          node --test
          test/registry.test.mjs
          test/publish.test.mjs
          test/orchestrate.test.mjs
