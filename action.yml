name: Releaseway npm publish
description: Publish npm packages through Releaseway's verified npm release engine.

inputs:
  artifacts-manifest:
    description: Optional source-bound schema 1 manifest of verified tarballs and SHA-512 SRI values. Every unpublished package requires an artifact; failures never fall back to packing.
    required: false
    default: ""

  release-commit:
    description: Optional full release marker SHA returned by releaseway/actions/prepare. Its parent and unchanged tree must match the workflow source; requires git-tag version policy.
    required: false
    default: ""

  release-tag:
    description: Optional exact remote tag to select with version.source git-tag; must resolve to the verified publication commit.
    required: false
    default: ""

outputs:
  packages:
    description: JSON array of package publication results.
  report-path:
    description: Runner-local JSON release report, also written to the job summary, including partial results on failure.

  diagnostics-path:
    description: Runner-local versioned diagnostics JSON, separate from existing reports; available on controlled failures when writable.

runs:
  using: node24
  main: dist/main.js
